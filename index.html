<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Texas Cash</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Texas Cash">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: app a due schede (Calcola / Registro) con barra di budget sempre in alto e tab bar in basso, pensata per iPhone. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #e4e9f0;
  --ink: #14213d;
  --ink-soft: #55627a;
  --line: #d3dae5;
  --accent: #b5361e;
  --accent-ink: #ffffff;
  --good: #1f7a4d;
  --warn: #a86400;
  --bad: #b5361e;
  --font-display: Rockwell, "Roboto Slab", Georgia, serif;
  --font-body: -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1522; --surface: #172134; --surface-2: #223049; --ink: #e8ecf3; --ink-soft: #9aa7bd;
    --line: #2a3a56; --accent: #f0654a; --accent-ink: #1a0d09; --good: #4cc38a; --warn: #e8a53a; --bad: #f0654a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) 96px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; margin: 0; letter-spacing: .01em; }
.rate { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--ink-soft); }
.rate input { width: 4.4rem; text-align: center; }

input[type=text], select {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px;
  min-height: 44px; width: 100%; min-width: 0;
}
.rate input { width: 4.6rem; }
.ratebar { flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .8rem; color: var(--ink-soft); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 600; }

/* budget strip */
.budget { gap: 10px; }
.budget-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.budget-left { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1.1; }
.budget-left.warn { color: var(--warn); } .budget-left.bad { color: var(--bad); } .budget-left.good { color: var(--good); }
.bar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 6px; transition: width .3s; }
.bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
.budget-sub { display: flex; justify-content: space-between; gap: 12px; font-size: .85rem; color: var(--ink-soft); flex-wrap: wrap; }
.plafond { display: flex; gap: 10px; align-items: center; }
.plafond .money { flex: 1; }

/* money input */
.money { position: relative; }
.money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); font-weight: 600; pointer-events: none; }
.money input { padding-left: 32px; }
.price input { font-size: 2rem; font-weight: 700; min-height: 64px; padding-left: 40px; }
.price span { font-size: 1.4rem; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pct { position: relative; }
.pct input { padding-right: 32px; }
.pct span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); font-weight: 600; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { flex: 1 1 0; min-width: 3.4rem; min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: .95rem; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }

.result { gap: 0; padding: 4px 16px; }
.line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line .k { color: var(--ink-soft); }
.line .v { text-align: right; font-weight: 600; }
.line .v small { display: block; font-weight: 400; color: var(--ink-soft); font-size: .8rem; }
.total { padding: 14px 0; }
.total .k { color: var(--ink); font-weight: 700; }
.total .v { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05; }
.total .v small { font-family: var(--font-body); font-size: 1rem; font-weight: 600; color: var(--accent); margin-top: 2px; }

.btn { min-height: 48px; border-radius: 12px; border: 0; padding: 0 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: .9rem; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 auto; }

.thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); background: var(--surface-2); flex: none; }
.pending { display: flex; align-items: center; gap: 12px; }

/* log */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .m { font-size: .8rem; color: var(--ink-soft); }
.item .amt { text-align: right; flex: none; }
.item .amt b { display: block; font-size: 1.05rem; }
.item .amt small { color: var(--ink-soft); }
.item .acts { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.photo-btn { padding: 0; border: 0; background: none; border-radius: 8px; }
.noimg { display: grid; place-items: center; font-size: .7rem; color: var(--ink-soft); text-align: center; }
.empty { text-align: center; color: var(--ink-soft); padding: 28px 12px; border: 1.5px dashed var(--line); border-radius: 14px; }
.sumline { display: flex; justify-content: space-between; align-items: baseline; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-soft); }
.cats span { background: var(--surface-2); border-radius: 999px; padding: 3px 10px; }

/* tabs */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
nav .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
nav button { min-height: 46px; border-radius: 12px; border: 0; background: transparent; font-weight: 700; color: var(--ink-soft); }
nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.viewer { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.viewer img { max-width: 100%; max-height: calc(100% - 70px); object-fit: contain; border-radius: 6px; }
.viewer .btn { background: #fff; color: #111; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 30; max-width: 90%; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
<script src="ocr.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Texas Cash</h1>
    <label class="rate" for="rate">1 $ = € <input id="rate" type="text" inputmode="decimal" aria-label="Cambio euro per un dollaro"></label>
    <div class="ratebar"><span id="rateInfo">Cambio manuale</span><button class="btn ghost small" id="rateRefresh" type="button">Aggiorna cambio</button></div>
  </header>

  <section class="card budget" aria-label="Plafond di spesa">
    <div class="budget-top">
      <div><div class="label">Ti restano</div><div class="budget-left num" id="left">$0</div></div>
      <div class="budget-sub" style="flex-direction:column;text-align:right"><span class="num" id="spent">Speso $0</span><span class="num" id="leftEur">€0</span></div>
    </div>
    <div class="bar" role="progressbar" aria-label="Plafond usato" id="barwrap"><i id="bar"></i></div>
    <div class="plafond">
      <label class="label" for="plafond">Plafond</label>
      <div class="money"><span>$</span><input id="plafond" type="text" inputmode="decimal" placeholder="es. 1500"></div>
    </div>
  </section>

  <main id="tab-calc" class="wrap" style="gap:14px">
    <section class="card" aria-label="Calcolatore">
      <div class="field price">
        <label class="label" for="price">Prezzo in dollari</label>
        <div class="money"><span>$</span><input id="price" type="text" inputmode="decimal" value="42.50"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label class="label" for="tax">Tasse (sales tax)</label>
          <div class="pct"><input id="tax" type="text" inputmode="decimal"><span>%</span></div>
        </div>
        <div class="field">
          <label class="label" for="tipc">Mancia personalizzata</label>
          <div class="pct"><input id="tipc" type="text" inputmode="decimal" placeholder="altro"><span>%</span></div>
        </div>
      </div>
      <div class="field">
        <span class="label" id="tiplabel">Mancia</span>
        <div class="chips" role="group" aria-labelledby="tiplabel" id="chips"></div>
      </div>
      <label class="toggle"><input type="checkbox" id="incl"> Il prezzo include già le tasse</label>
    </section>

    <section class="card result" aria-live="polite">
      <div class="line"><span class="k">Prezzo senza tasse</span><span class="v num" id="rNet"></span></div>
      <div class="line"><span class="k">Tasse</span><span class="v num" id="rTax"></span></div>
      <div class="line"><span class="k">Mancia</span><span class="v num" id="rTip"></span></div>
      <div class="line total"><span class="k">Totale</span><span class="v num" id="rTot"></span></div>
    </section>

    <section class="card" aria-label="Salva la spesa">
      <div class="label">Salva nel registro</div>
      <input id="desc" type="text" placeholder="Cosa hai comprato? (es. cena da Terry Black's)" autocomplete="off">
      <select id="cat" aria-label="Categoria"></select>
      <div class="pending" id="pending" hidden>
        <img class="thumb" id="pendImg" alt="Anteprima scontrino">
        <button class="btn ghost small" id="pendRemove" type="button">Rimuovi foto</button>
      </div>
      <div class="btnrow">
        <label class="btn ghost" style="display:grid;place-items:center;cursor:pointer" for="file">Foto scontrino</label>
        <button class="btn" id="save" type="button">Salva spesa</button>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
    </section>

    <section class="card" id="ocrCard" aria-label="Importi letti dallo scontrino" hidden>
      <div class="label">Letto dallo scontrino</div>
      <div class="budget-sub" id="ocrStatus" aria-live="polite"></div>
      <div id="ocrFields">
        <div class="row2">
          <div class="field"><label class="label" for="oSub">Subtotale</label><div class="money"><span>$</span><input id="oSub" type="text" inputmode="decimal"></div></div>
          <div class="field"><label class="label" for="oTax">Tasse</label><div class="money"><span>$</span><input id="oTax" type="text" inputmode="decimal"></div></div>
          <div class="field"><label class="label" for="oTip">Mancia</label><div class="money"><span>$</span><input id="oTip" type="text" inputmode="decimal"></div></div>
          <div class="field"><label class="label" for="oTot">Totale</label><div class="money"><span>$</span><input id="oTot" type="text" inputmode="decimal"></div></div>
        </div>
        <div class="btnrow" style="margin-top:12px">
          <button class="btn" id="ocrApply" type="button">Usa questi valori</button>
          <button class="btn ghost" id="ocrRetry" type="button">Rileggi</button>
        </div>
      </div>
    </section>
  </main>

  <main id="tab-log" class="wrap" style="gap:14px" hidden>
    <div class="card" style="gap:8px">
      <div class="sumline"><span class="label">Totale speso</span><b class="num" id="logTot"></b></div>
      <div class="cats" id="catSum"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="card" style="gap:10px">
      <div class="label">Backup</div>
      <div class="budget-sub">Salva una copia di spese e foto. Utile se cambi telefono o iOS libera spazio.</div>
      <div class="btnrow">
        <button class="btn ghost" id="bkExport" type="button">Salva backup</button>
        <label class="btn ghost" style="display:grid;place-items:center;cursor:pointer" for="bkImport">Ripristina</label>
      </div>
      <input id="bkImport" type="file" accept="application/json,.json" hidden>
      <div class="budget-sub" id="bkInfo"></div>
    </div>
  </main>
</div>

<nav aria-label="Sezioni"><div class="in" role="tablist">
  <button role="tab" id="t1" aria-selected="true" aria-controls="tab-calc" type="button">Calcola</button>
  <button role="tab" id="t2" aria-selected="false" aria-controls="tab-log" type="button">Registro <span id="cnt"></span></button>
</div></nav>
<div id="viewerHost"></div>
<div id="toastHost"></div>

<script>
(function () {
  var CATS = ['Cibo', 'Souvenir', 'Benzina', 'Hotel', 'Attrazioni', 'Altro'];
  var TIPS = [0, 15, 18, 20, 25];
  var KEY = 'texascash.v1';
  var st = { rate: 0.86, tax: 8.25, tip: 18, plafond: 0, expenses: [] };
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') { for (var k in s) st[k] = s[k]; } } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; }
  function f(n) { return n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function usd(n) { return '$' + f(n); }
  function eur(n) { return '€' + f(n); }

  /* photos: IndexedDB with in-memory fallback */
  var mem = {}, dbp = null;
  function db() {
    if (!dbp) dbp = new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('texascash', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('photos'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function putPhoto(id, blob) {
    mem[id] = blob;
    return db().then(function (d) { return new Promise(function (res) {
      var t = d.transaction('photos', 'readwrite'); t.objectStore('photos').put(blob, id); t.oncomplete = res; t.onerror = res; }); }).catch(function () {});
  }
  function getPhoto(id) {
    if (mem[id]) return Promise.resolve(mem[id]);
    return db().then(function (d) { return new Promise(function (res) {
      var q = d.transaction('photos').objectStore('photos').get(id); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; }); }).catch(function () { return null; });
  }
  function delPhoto(id) {
    delete mem[id];
    return db().then(function (d) { d.transaction('photos', 'readwrite').objectStore('photos').delete(id); }).catch(function () {});
  }
  function enhanceCanvas(c) {
    var g = c.getContext('2d'), im = g.getImageData(0, 0, c.width, c.height), d = im.data, n = d.length / 4, hist = new Uint32Array(256), i, v;
    for (i = 0; i < d.length; i += 4) { v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0; d[i] = v; hist[v]++; }
    var cut = n * 0.02, acc = 0, lo = 0, hi = 255;
    for (i = 0; i < 256; i++) { acc += hist[i]; if (acc >= cut) { lo = i; break; } }
    acc = 0; for (i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= cut) { hi = i; break; } }
    var span = Math.max(1, hi - lo);
    for (i = 0; i < d.length; i += 4) { v = Math.max(0, Math.min(255, ((d[i] - lo) * 255 / span) | 0)); d[i] = d[i + 1] = d[i + 2] = v; }
    g.putImageData(im, 0, 0);
  }
  function shrink(file, max, enhance) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var m = max || 1400, sc = Math.min(1, m / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        if (enhance) { try { enhanceCanvas(c); } catch (e) {} }
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? res(b) : res(file); }, 'image/jpeg', 0.72);
      };
      img.onerror = function () { URL.revokeObjectURL(url); res(file); };
      img.src = url;
    });
  }

  function toast(msg) {
    var h = $('toastHost'); h.innerHTML = '';
    var d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; h.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.remove(); }, 2200);
  }

  /* calculator */
  function calc() {
    var p = num($('price').value), t = num($('tax').value) / 100, tipPct = st.tip / 100, r = st.rate;
    var net = $('incl').checked ? p / (1 + t) : p;
    var tax = net * t, tip = net * tipPct, tot = net + tax + tip;
    return { net: net, tax: tax, tip: tip, tot: tot, r: r };
  }
  function two(usdv, r) { return usd(usdv) + '<small>' + eur(usdv * r) + '</small>'; }
  function renderCalc() {
    var c = calc();
    $('rNet').innerHTML = two(c.net, c.r);
    $('rTax').innerHTML = two(c.tax, c.r);
    $('rTip').innerHTML = two(c.tip, c.r) .replace('<small>', '<small>' + st.tip + '% · ');
    $('rTot').innerHTML = usd(c.tot) + '<small>' + eur(c.tot * c.r) + '</small>';
    document.querySelectorAll('.chip').forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.v) === st.tip)); });
  }

  /* budget */
  function spentTotal() { return st.expenses.reduce(function (a, e) { return a + e.usd; }, 0); }
  function renderBudget() {
    var sp = spentTotal(), pl = st.plafond, left = pl - sp;
    $('spent').textContent = 'Speso ' + usd(sp);
    var bar = $('bar'), lf = $('left');
    if (pl > 0) {
      var pct = Math.min(100, sp / pl * 100), cls = pct >= 100 ? 'bad' : pct >= 80 ? 'warn' : 'good';
      lf.textContent = (left < 0 ? '-' : '') + usd(Math.abs(left)); lf.className = 'budget-left num ' + cls;
      bar.style.width = pct + '%'; bar.className = cls === 'good' ? '' : cls;
      $('leftEur').textContent = (left < 0 ? '-' : '') + eur(Math.abs(left) * st.rate) + ' · ' + Math.round(pct) + '% usato';
      $('barwrap').setAttribute('aria-valuenow', Math.round(pct));
    } else {
      lf.textContent = 'Imposta il plafond'; lf.className = 'budget-left'; lf.style.fontSize = '1.1rem';
      bar.style.width = '0'; $('leftEur').textContent = '';
    }
    if (pl > 0) lf.style.fontSize = '';
  }

  /* log */
  function dateStr(ts) { return new Date(ts).toLocaleString('it-IT', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  function renderLog() {
    $('cnt').textContent = st.expenses.length ? '(' + st.expenses.length + ')' : '';
    $('logTot').innerHTML = usd(spentTotal()) + ' · ' + eur(spentTotal() * st.rate);
    var byCat = {};
    st.expenses.forEach(function (e) { byCat[e.cat] = (byCat[e.cat] || 0) + e.usd; });
    $('catSum').innerHTML = Object.keys(byCat).map(function (c) { return '<span class="num">' + c + ' ' + usd(byCat[c]) + '</span>'; }).join('') || '<span>Nessuna spesa</span>';
    var list = $('list'); list.innerHTML = '';
    if (!st.expenses.length) {
      list.innerHTML = '<div class="empty">Nessuna spesa ancora.<br>Calcola un prezzo e premi Salva spesa.</div>';
      return;
    }
    st.expenses.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (e) {
      var el = document.createElement('div'); el.className = 'item';
      var th = document.createElement('div');
      if (e.photo) {
        var pb = document.createElement('button'); pb.type = 'button'; pb.className = 'photo-btn'; pb.setAttribute('aria-label', 'Apri scontrino');
        var im = document.createElement('img'); im.className = 'thumb'; im.alt = 'Scontrino'; pb.appendChild(im); th.appendChild(pb);
        getPhoto(e.id).then(function (b) { if (b) im.src = URL.createObjectURL(b); });
        pb.onclick = function () { openViewer(e.id); };
      } else {
        th.className = 'thumb noimg'; th.textContent = 'senza foto';
      }
      var body = document.createElement('div'); body.className = 'body';
      body.innerHTML = '<span class="t"></span><span class="m"></span>';
      body.firstChild.textContent = e.desc || e.cat;
      body.lastChild.textContent = e.cat + ' · ' + dateStr(e.ts);
      var acts = document.createElement('div'); acts.className = 'acts';
      if (!e.photo) {
        var lb = document.createElement('label'); lb.className = 'btn ghost small'; lb.style.cssText = 'display:grid;place-items:center;cursor:pointer';
        lb.textContent = 'Aggiungi foto';
        var fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*'; fi.hidden = true;
        fi.onchange = function () { if (fi.files[0]) shrink(fi.files[0]).then(function (b) { return putPhoto(e.id, b); }).then(function () { e.photo = true; persist(); renderLog(); }); };
        lb.appendChild(fi); acts.appendChild(lb);
      }
      var del = document.createElement('button'); del.type = 'button'; del.className = 'btn ghost small'; del.textContent = 'Elimina';
      var armed = false;
      del.onclick = function () {
        if (!armed) { armed = true; del.textContent = 'Conferma?'; setTimeout(function () { armed = false; del.textContent = 'Elimina'; }, 3000); return; }
        st.expenses = st.expenses.filter(function (x) { return x.id !== e.id; });
        delPhoto(e.id); persist(); renderAll();
      };
      acts.appendChild(del); body.appendChild(acts);
      var amt = document.createElement('div'); amt.className = 'amt num';
      amt.innerHTML = '<b>' + usd(e.usd) + '</b><small>' + eur(e.eur) + '</small>';
      el.appendChild(th); el.appendChild(body); el.appendChild(amt); list.appendChild(el);
    });
  }
  function openViewer(id) {
    getPhoto(id).then(function (b) {
      if (!b) return;
      var url = URL.createObjectURL(b), h = $('viewerHost');
      h.innerHTML = '<div class="viewer"><img alt="Scontrino"><button class="btn" type="button">Chiudi</button></div>';
      h.querySelector('img').src = url;
      h.querySelector('button').onclick = function () { h.innerHTML = ''; URL.revokeObjectURL(url); };
    });
  }

  function renderAll() { renderCalc(); renderBudget(); renderLog(); }

  /* setup */
  $('chips').innerHTML = TIPS.map(function (v) { return '<button type="button" class="chip" data-v="' + v + '" aria-pressed="false">' + (v === 0 ? 'No' : v + '%') + '</button>'; }).join('');
  $('cat').innerHTML = CATS.map(function (c) { return '<option>' + c + '</option>'; }).join('');
  $('rate').value = String(st.rate).replace('.', ',');
  $('tax').value = String(st.tax).replace('.', ',');
  $('plafond').value = st.plafond ? String(st.plafond).replace('.', ',') : '';

  $('chips').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip'); if (!b) return;
    st.tip = Number(b.dataset.v); $('tipc').value = ''; persist(); renderCalc();
  });
  $('tipc').addEventListener('input', function () {
    var v = num($('tipc').value); if ($('tipc').value.trim() === '') return;
    st.tip = v; persist(); renderCalc();
  });
  $('price').addEventListener('input', renderCalc);
  $('incl').addEventListener('change', renderCalc);
  $('tax').addEventListener('input', function () { var v = num($('tax').value); st.tax = v; persist(); renderCalc(); });
  $('rate').addEventListener('input', function () { var v = num($('rate').value); if (v) { st.rate = v; st.rateManual = true; persist(); renderAll(); setRateInfo(); } });
  $('plafond').addEventListener('input', function () { st.plafond = num($('plafond').value); persist(); renderBudget(); });

  var pending = null;
  $('file').addEventListener('change', function () {
    var fl = $('file').files[0]; if (!fl) return;
    shrink(fl).then(function (b) { pending = b; $('pendImg').src = URL.createObjectURL(b); $('pending').hidden = false; });
    shrink(fl, 2200, true).then(function (b) { ocrSource = b; readReceipt(); });
    $('file').value = '';
  });

  /* lettura importi dallo scontrino (OCR sul telefono, funziona offline) */
  var ocrSource = null, ocrWorker = null;
  function absUrl(p) { return new URL(p, location.href).href; }
  function loadScript(src) { return new Promise(function (res, rej) { var el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
  function getWorker() {
    if (!ocrWorker) {
      ocrWorker = (window.Tesseract ? Promise.resolve() : loadScript('vendor/tesseract.min.js')).then(function () {
        return Tesseract.createWorker('eng', 1, {
          workerPath: absUrl('vendor/worker.min.js'), corePath: absUrl('vendor/'), langPath: absUrl('vendor/'),
          workerBlobURL: false, gzip: true,
          logger: function (m) { if (m.status === 'recognizing text') ocrStatus('Lettura dello scontrino… ' + Math.round(m.progress * 100) + '%'); }
        }).then(function (w) { return w.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' }).then(function () { return w; }); });
      });
      ocrWorker.catch(function () { ocrWorker = null; });
    }
    return ocrWorker;
  }
  function ocrStatus(t) { $('ocrStatus').textContent = t; }
  function setOcr(r) {
    $('oSub').value = r.subtotal != null ? f(r.subtotal) : '';
    $('oTax').value = r.tax != null ? f(r.tax) : '';
    $('oTip').value = r.tip != null ? f(r.tip) : '';
    $('oTot').value = r.total != null ? f(r.total) : '';
  }
  function readReceipt() {
    if (!ocrSource) return;
    $('ocrCard').hidden = false; $('ocrFields').hidden = true; setOcr({});
    ocrStatus('Preparo la lettura…');
    $('ocrCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    getWorker().then(function (w) { return w.recognize(ocrSource); }).then(function (res) {
      var r = parseReceipt(res.data.text);
      setOcr(r); $('ocrFields').hidden = false;
      var found = [r.subtotal, r.tax, r.tip, r.total].filter(function (x) { return x != null; }).length;
      ocrStatus(found ? 'Controlla gli importi e correggili se serve.' + (r.notes.length ? ' ' + r.notes.join(' ') : '') : 'Non ho trovato importi: scrivili qui sotto o inseriscili a mano.');
    }).catch(function (e) {
      console.error('ocr', e);
      $('ocrFields').hidden = false;
      ocrStatus('Lettura non riuscita. Inserisci gli importi a mano.');
    });
  }
  $('ocrRetry').onclick = readReceipt;
  $('ocrApply').onclick = function () {
    var sub = num($('oSub').value), tax = num($('oTax').value), tip = num($('oTip').value), tot = num($('oTot').value);
    var net = sub;
    if (!net && tot) net = tot - tax - tip;
    if (net <= 0) { toast('Serve almeno il totale'); return; }
    $('price').value = String(Math.round(net * 100) / 100);
    if (tax) { $('tax').value = String(Math.round(tax / net * 10000) / 100).replace('.', ','); st.tax = tax / net * 100; $('incl').checked = false; }
    else if (!sub) { $('incl').checked = true; }
    st.tip = Math.round(tip / net * 10000) / 100;
    $('tipc').value = TIPS.indexOf(st.tip) >= 0 ? '' : String(st.tip).replace('.', ',');
    persist(); renderCalc();
    toast('Importi applicati');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  $('pendRemove').onclick = function () { pending = null; ocrSource = null; $('pending').hidden = true; $('ocrCard').hidden = true; };

  $('save').onclick = function () {
    var c = calc();
    if (!c.tot) { toast('Inserisci un prezzo'); return; }
    var id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var e = { id: id, ts: Date.now(), desc: $('desc').value.trim(), cat: $('cat').value, usd: Math.round(c.tot * 100) / 100, eur: c.tot * st.rate, photo: !!pending };
    var p = pending ? putPhoto(id, pending) : Promise.resolve();
    p.then(function () {
      st.expenses.push(e); persist();
      pending = null; ocrSource = null; $('pending').hidden = true; $('ocrCard').hidden = true; $('desc').value = '';
      renderAll(); toast('Salvata: ' + usd(e.usd));
    });
  };

  function tab(n) {
    $('tab-calc').hidden = n !== 1; $('tab-log').hidden = n !== 2;
    $('t1').setAttribute('aria-selected', String(n === 1)); $('t2').setAttribute('aria-selected', String(n === 2));
    window.scrollTo(0, 0);
  }
  $('t1').onclick = function () { tab(1); };
  $('t2').onclick = function () { tab(2); };

  renderAll();
  setRateInfo(); backupInfo(); fetchRate(false);

  /* cambio live quando c'è rete */
  function setRateInfo() {
    var el = $('rateInfo');
    el.textContent = st.rateManual ? 'Cambio manuale' : st.rateDate ? 'Cambio BCE del ' + st.rateDate : 'Cambio non ancora aggiornato';
  }
  function fetchRate(force) {
    if (st.rateManual && !force) return;
    var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 6000);
    fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR', { signal: ctl.signal })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        clearTimeout(to);
        if (d && d.rates && d.rates.EUR) {
          st.rate = d.rates.EUR; st.rateDate = d.date; st.rateManual = false; persist();
          $('rate').value = String(Math.round(st.rate * 10000) / 10000).replace('.', ','); renderAll(); setRateInfo();
          if (force) toast('Cambio aggiornato');
        }
      })
      .catch(function () { clearTimeout(to); if (force) toast('Nessuna rete: tengo il cambio salvato'); });
  }
  $('rateRefresh').onclick = function () { fetchRate(true); };

  /* backup */
  function blobToData(b) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { res(null); }; r.readAsDataURL(b); }); }
  function dataToBlob(u) { return fetch(u).then(function (r) { return r.blob(); }); }
  $('bkExport').onclick = function () {
    Promise.all(st.expenses.filter(function (e) { return e.photo; }).map(function (e) {
      return getPhoto(e.id).then(function (b) { return b ? blobToData(b).then(function (u) { return [e.id, u]; }) : null; });
    })).then(function (ps) {
      var photos = {}; ps.forEach(function (p) { if (p && p[1]) photos[p[0]] = p[1]; });
      var data = JSON.stringify({ app: 'texascash', v: 1, state: st, photos: photos });
      var name = 'texas-cash-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      var file = new File([data], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Backup Texas Cash' }).then(function () { markBackup(); }).catch(function () {});
      } else {
        var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); markBackup();
      }
    });
  };
  function markBackup() { st.lastBackup = Date.now(); persist(); backupInfo(); toast('Backup pronto'); }
  function backupInfo() { $('bkInfo').textContent = st.lastBackup ? 'Ultimo backup: ' + dateStr(st.lastBackup) : 'Nessun backup ancora.'; }
  $('bkImport').addEventListener('change', function () {
    var fl = $('bkImport').files[0]; if (!fl) return;
    fl.text().then(function (t) {
      var d = JSON.parse(t);
      if (!d || d.app !== 'texascash' || !d.state) throw new Error('bad');
      var ids = Object.keys(d.photos || {});
      return Promise.all(ids.map(function (id) { return dataToBlob(d.photos[id]).then(function (b) { return putPhoto(id, b); }); })).then(function () {
        for (var k in d.state) st[k] = d.state[k];
        persist(); $('rate').value = String(st.rate).replace('.', ','); $('tax').value = String(st.tax).replace('.', ',');
        $('plafond').value = st.plafond ? String(st.plafond).replace('.', ',') : ''; renderAll(); setRateInfo(); toast('Backup ripristinato');
      });
    }).catch(function () { toast('File di backup non valido'); });
    $('bkImport').value = '';
  });

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
</body>
</html>
