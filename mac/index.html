<style>
/* Layout: barra in alto con Importa file, poi tre colonne (una per persona) e una quarta con il totale. Stile liquid glass come l'app iPhone. */
:root {
  --bg: #cfd8e6; --ink: #0e1a30; --ink-soft: #384764;
  --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.8); --glass-line: rgba(255,255,255,.75);
  --glass-shadow: 0 8px 30px rgba(10,25,55,.18); --glass-hi: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25);
  --field: rgba(255,255,255,.62); --scrim: rgba(225,233,246,.55);
  --accent: #c0391f; --accent-ink: #fff; --good: #14733f; --warn: #9a5b00; --bad: #c0391f;
  --font-display: Rockwell, "Roboto Slab", Georgia, serif; --font-body: -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a111d; --ink: #f1f4fa; --ink-soft: #aab6cc;
    --glass: rgba(20,30,50,.55); --glass-strong: rgba(24,36,60,.8); --glass-line: rgba(255,255,255,.2);
    --glass-shadow: 0 10px 34px rgba(0,0,0,.45); --glass-hi: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.04);
    --field: rgba(255,255,255,.10); --scrim: rgba(6,12,24,.62);
    --accent: #ff7157; --accent-ink: #220d08; --good: #55d196; --warn: #f0b04a; --bad: #ff7157; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; padding: 20px max(20px, env(safe-area-inset-right, 0px)) 40px max(20px, env(safe-area-inset-left, 0px)); }
[hidden] { display: none !important; }
.bgwrap { position: fixed; inset: 0; z-index: -2; background: var(--bg) url(../img/houston.jpg) center / cover no-repeat; filter: blur(10px) saturate(1.2); transform: scale(1.04); }
.scrim { position: fixed; inset: 0; z-index: -1; background: var(--scrim); }
button, input { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow), var(--glass-hi); -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7); }
h1 { font-family: var(--font-display); font-size: 1.7rem; margin: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-radius: 22px; padding: 14px 20px; max-width: 1600px; margin: 0 auto 18px; }
.top .sub { color: var(--ink-soft); font-size: .9rem; }
.btn { min-height: 42px; border-radius: 14px; border: 1px solid var(--glass-line); padding: 0 18px; font-weight: 700; background: color-mix(in srgb, var(--accent) 88%, transparent); color: var(--accent-ink); box-shadow: 0 4px 14px rgba(10,25,55,.18), var(--glass-hi); }
.btn.ghost { background: var(--glass); color: var(--ink); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: .8rem; border-radius: 10px; }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; max-width: 1600px; margin: 0 auto; align-items: start; }
@media (max-width: 1250px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
.col { border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.col.total { box-shadow: var(--glass-shadow), var(--glass-hi), 0 0 0 2px var(--accent); }
.col h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.col.empty { color: var(--ink-soft); text-align: center; padding: 40px 18px; border-style: dashed; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 700; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.left { font-family: var(--font-display); font-size: 2.1rem; font-weight: 700; line-height: 1.1; }
.left.good { color: var(--good); } .left.warn { color: var(--warn); } .left.bad { color: var(--bad); }
.sub2 { color: var(--ink-soft); font-size: .85rem; }
.bar { height: 10px; border-radius: 5px; background: rgba(120,140,170,.28); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 5px; }
.bar i.warn { background: var(--warn); } .bar i.bad { background: var(--bad); }
.cat { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 8px; align-items: center; font-size: .85rem; }
.cat .bar { height: 8px; }
.donut { position: relative; width: 140px; height: 140px; margin: 4px auto; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.15; }
.donut .mid b { font-size: 1rem; font-family: var(--font-display); }
.donut .mid span { font-size: .68rem; color: var(--ink-soft); }
.legend { display: flex; flex-direction: column; gap: 5px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
.legend i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.legend .n { flex: 1; min-width: 0; }

.sect { display: flex; flex-direction: column; gap: 8px; }

.row:last-child { border-bottom: 0; }

summary { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-weight: 700; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary .d { text-transform: capitalize; }
.items { padding: 6px 0 2px 10px; display: flex; flex-direction: column; gap: 3px; font-size: .84rem; color: var(--ink-soft); }
.items .erow { display: flex; justify-content: space-between; gap: 8px; }
.exp { padding: 2px 0; }
.cbtn { border: 0; background: none; color: var(--accent); font-size: .78rem; padding: 2px 0; cursor: pointer; font-weight: 600; }
.cnote { display: block; width: 100%; text-align: left; border: 0; background: var(--field); border-radius: 10px; padding: 6px 10px; margin-top: 2px; font-size: .82rem; color: var(--ink); white-space: pre-wrap; cursor: pointer; }
.cedit textarea { width: 100%; border-radius: 10px; border: 1px solid var(--glass-line); background: var(--field); padding: 8px; font: inherit; font-size: .85rem; resize: vertical; margin-top: 4px; color: var(--ink); }
.crow { display: flex; gap: 6px; margin-top: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .75rem; border-radius: 999px; padding: 2px 9px; background: var(--field); border: 1px solid var(--glass-line); }
.drop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 35%, transparent); font-family: var(--font-display); font-size: 2rem; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; background: var(--glass-strong); border: 1px solid var(--glass-line); padding: 10px 18px; border-radius: 999px; font-weight: 700; box-shadow: var(--glass-shadow); }
.msg { max-width: 1600px; margin: 0 auto 16px; border-radius: 18px; padding: 12px 18px; color: var(--ink-soft); }

/* tab e cloud */
.tabs { display: flex; gap: 8px; max-width: 1600px; margin: 0 auto 16px; flex-wrap: wrap; }
.tab { min-height: 38px; border-radius: 999px; border: 1px solid var(--glass-line); padding: 0 18px; font-weight: 700; background: var(--glass); color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.view { max-width: 1600px; margin: 0 auto; }
.cloudrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-soft); }
.cloudrow input[type=text] { min-height: 32px; border-radius: 10px; border: 1px solid var(--glass-line); background: var(--field); padding: 0 10px; color: var(--ink); width: 150px; }
.panel { border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fchip { border-radius: 999px; border: 1px solid var(--glass-line); background: var(--field); padding: 4px 14px; font-weight: 600; font-size: .85rem; color: var(--ink); }
.fchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.fchip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
select.sel { min-height: 32px; border-radius: 10px; border: 1px solid var(--glass-line); background: var(--field); color: var(--ink); padding: 0 8px; }
.mapbox { height: 68vh; min-height: 420px; border-radius: 18px; overflow: hidden; position: relative; z-index: 0; isolation: isolate; border: 1px solid var(--glass-line); }
.pg { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pg button { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 14px; overflow: hidden; background: var(--field); }
.pg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pg .tag { position: absolute; left: 6px; bottom: 6px; font-size: .72rem; font-weight: 700; color: #fff; padding: 1px 8px; border-radius: 999px; }
.mk { width: 30px; height: 30px; display: grid; place-items: center; color: #fff; font: 700 .85rem/1 var(--font-body); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.mk.s { border-radius: 50%; } .mk.f { border-radius: 8px; } .mk.d { border-radius: 4px; transform: rotate(45deg); } .mk.d span { transform: rotate(-45deg); display: block; }
.mk.g { border-radius: 50%; background: #333; }
.lb { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
.lb img { max-width: 92vw; max-height: 74vh; object-fit: contain; border-radius: 12px; }
.lb .cap { color: #fff; text-align: center; }
.lb .btn { background: #fff; color: #111; }
.lbrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sheetm { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); z-index: 25; background: var(--glass-strong); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: -8px 0 40px rgba(0,0,0,.35); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sheetm h3 { margin: 0; font-family: var(--font-display); }
.it { padding: 10px 0; border-top: 1px solid var(--glass-line); display: flex; flex-direction: column; gap: 6px; }
.it:first-of-type { border-top: 0; }
.it img { max-width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; cursor: pointer; }
.it .tx { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1rem; }
.dcard { border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.dcard h3 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; text-transform: capitalize; }
.dph { display: flex; gap: 8px; flex-wrap: wrap; }
.dph img { width: 100%; max-width: 420px; max-height: 360px; object-fit: cover; border-radius: 14px; cursor: pointer; }
.lock { max-width: 560px; }
.chkgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.chkcol { border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.chkcol h3 { margin: 0; font-family: var(--font-display); display: flex; justify-content: space-between; align-items: baseline; }
.chkcol h4 { margin: 10px 0 2px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); display: flex; justify-content: space-between; }
.ci { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; padding: 2px 0; }
.ci .bx { flex: none; width: 17px; height: 17px; border-radius: 5px; border: 2px solid var(--ink-soft); display: grid; place-items: center; font-size: .7rem; color: #fff; margin-top: 1px; }
.ci.done .bx { background: var(--good); border-color: var(--good); }
.ci.done .t { color: var(--ink-soft); text-decoration: line-through; }
.ci small { display: block; color: var(--ink-soft); text-decoration: none; font-size: .72rem; }
.ovr { display: grid; grid-template-columns: 8rem 1fr auto; gap: 12px; align-items: center; }

.lock input[type=password] { min-height: 38px; border-radius: 10px; border: 1px solid var(--glass-line); background: var(--field); padding: 0 12px; color: var(--ink); }

/* ===== Stile iOS (12 nov 2026): strato che sovrascrive il resto, la logica non cambia ===== */
:root { --bg: #f2f2f7; --card: #ffffff; --ink: #1c1c1e; --ink-soft: #636366; --sep: rgba(60,60,67,.18); --field: rgba(118,118,128,.12);
  --accent: #007aff; --accent-ink: #fff; --tint-soft: rgba(0,122,255,.12); --good: #248a3d; --warn: #b25000; --bad: #d70015;
  --font-display: -apple-system, "SF Pro Rounded", "SF Pro Display", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --ink: #fff; --ink-soft: #aeaeb2; --sep: rgba(84,84,88,.6); --field: rgba(118,118,128,.24);
  --accent: #0a84ff; --accent-ink: #fff; --tint-soft: rgba(10,132,255,.22); --good: #30d158; --warn: #ff9f0a; --bad: #ff453a; } }
.bgwrap, .scrim { display: none; }
body { background: var(--bg); font-size: 15px; }
.glass, .col, .panel, .dcard, .chkcol { background: var(--card); border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.col, .panel, .chkcol { border-radius: 16px; }
.dcard { border-radius: 14px; }
.col.total { box-shadow: 0 0 0 2px var(--accent); }
.col.empty { background: transparent; border: 2px dashed var(--sep); }
.msg { background: var(--card); border-radius: 12px; }
/* intestazione: titolo grande, senza riquadro */
.top { background: none; box-shadow: none; padding: 4px 4px 0; border-radius: 0; }
h1 { font-size: 2.3rem; font-weight: 700; letter-spacing: -.02em; }
.col h2, .sheetm h3, .dcard h3, .chkcol h3 { font-weight: 700; letter-spacing: -.01em; }
/* tasti a pastiglia */
.btn { min-height: 36px; border-radius: 999px; border: 0; padding: 0 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn:active { opacity: .7; }
.btn.ghost { background: var(--tint-soft); color: var(--accent); }
.btn.small { min-height: 28px; padding: 0 12px; font-size: .8rem; }
/* schede: controllo segmentato */
.tabs { width: fit-content; max-width: 100%; gap: 2px; background: var(--field); padding: 3px; border-radius: 10px; flex-wrap: nowrap; overflow-x: auto; }
.tab { min-height: 30px; border: 0; border-radius: 8px; padding: 0 16px; font-weight: 500; background: transparent; color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.fchip, .chip { border: 0; background: var(--field); color: var(--ink); }
.fchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.cloudrow input[type=text], .lock input[type=password], select.sel, .cedit textarea { border: 0; background: var(--field); border-radius: 10px; }
.row, details, .it { border-color: var(--sep); }
.cnote { background: var(--field); }
.cbtn { color: var(--accent); }
.label { letter-spacing: .02em; font-weight: 600; }
.left { font-weight: 700; }
.bar { background: var(--field); box-shadow: none; }
.mapbox { border: 0; border-radius: 14px; }
.pg button { border-radius: 12px; }
.toast { background: rgba(60,60,67,.92); color: #fff; border: 0; box-shadow: none; }
.sheetm { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }

.sect > .erow { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; padding: 3px 0; }

/* programma, posizioni, album, diari con mappa e Post-it */
.calrow { display: flex; gap: 14px; padding: 10px 2px; border-bottom: 1px solid var(--sep); align-items: flex-start; }
.calrow:last-of-type { border-bottom: 0; }
.calrow .tm { flex: none; width: 3.6rem; font-weight: 700; color: var(--accent); padding-top: 1px; }
.calrow .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px 14px; }
.albtile { border: 0; background: none; padding: 0; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 3px; }
.albcov { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--field); display: grid; place-items: center; font-size: 3rem; font-weight: 700; margin-bottom: 4px; }
.albcov img { width: 100%; height: 100%; object-fit: cover; display: block; }
.albname { font-weight: 600; } .albcnt { color: var(--ink-soft); font-size: .85rem; }
.djrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 760px; }
.djrow.one { grid-template-columns: 1fr; max-width: 420px; }
.djph, .djmap { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--field); }
.djph img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; max-height: none; border-radius: 0; }
.djtiles { position: absolute; left: 50%; top: 50%; width: 768px; height: 768px; display: grid; grid-template-columns: repeat(3, 256px); grid-template-rows: repeat(3, 256px); }
.djtiles img { width: 256px; height: 256px; display: block; }
.djpin { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #5e5ce6; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.djpin::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; }
.djpost { position: relative; aspect-ratio: 1; border-radius: 6px 6px 14px 6px; padding: 14px 12px; overflow: hidden; background: linear-gradient(160deg, #fff6a8, #ffe66d); color: #4a3b00; box-shadow: 0 3px 8px rgba(0,0,0,.18); font-family: "Bradley Hand", "Noteworthy", "Marker Felt", "Segoe Print", cursive; font-size: 1.1rem; line-height: 1.3; transform: rotate(-1.2deg); }
.djpost span { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.djrow.one .djpost { aspect-ratio: 16 / 9; }

/* ===== Mac piu' vicino al telefono: barra laterale con le stesse icone a riquadro, titolo grande, tasti a destra ===== */
body { padding: 0; }
.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 26px 16px 20px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--sep); }
.brand b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
.brand .sub { color: var(--ink-soft); font-size: .8rem; margin-top: 4px; }
.side .tabs { display: flex; flex-direction: column; gap: 2px; width: auto; max-width: none; margin: 0; padding: 0; background: none; border-radius: 0; overflow: visible; flex-wrap: nowrap; }
.side .tab { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 5px 10px; border-radius: 12px; text-align: left; font-size: 1rem; font-weight: 500; background: transparent; box-shadow: none; }
.side .tab[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.side .tab .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, var(--card)); color: var(--c); }
.side .tab .ic svg { width: 20px; height: 20px; }
.ic.red { --c: #ff375f; } .ic.blue { --c: #0a84ff; } .ic.indigo { --c: #6e6af0; } .ic.sky { --c: #27a9e8; } .ic.lime { --c: #2fb457; } .ic.amber { --c: #f59a0c; }
.ic.pink { --c: #ec4899; } .ic.teal { --c: #14a9be; } .ic.green { --c: #34c759; } .ic.purple { --c: #a24ee0; } .ic.mint { --c: #00b8a9; } .ic.coral { --c: #ff6a3d; }
.cloudbox { margin-top: auto; background: var(--card); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.cloudbox .cloudrow { display: flex; gap: 8px; }
.cloudbox .cloudrow input[type=text] { flex: 1; width: auto; min-width: 0; }

.djph::after, .djmap::after, .djpost::after { content: ""; position: absolute; top: -7px; left: 50%; width: 17px; height: 17px; margin-left: -8px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #ff9e94, #d9302a 58%, #8c1713); box-shadow: 0 3px 4px rgba(0,0,0,.4), inset 0 -1px 2px rgba(0,0,0,.3); z-index: 3; }
.djmap::after { background: radial-gradient(circle at 34% 30%, #9ec5ff, #2f6fd6 58%, #173f8c); }
.djpost::after { background: radial-gradient(circle at 34% 30%, #a8e6a0, #2fa83a 58%, #17661f); }
.dje:nth-child(even) .djph { transform: rotate(1.8deg); }
.dje:nth-child(even) .djmap { transform: rotate(-2.2deg); }
.djpin { z-index: 2; }

<script>
(function () {
  var KEY = 'texascash.mac.v1';
  var st = { people: {}, deleted: [], comments: {} };
  try { var s0 = JSON.parse(localStorage.getItem(KEY)); if (s0 && s0.people) st = s0; } catch (e) {}
  if (!st.comments) st.comments = {};
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  function f(n) { return n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function usd(n) { return (n < 0 ? '-' : '') + '$' + f(Math.abs(n)); }
  function eur(n) { return (n < 0 ? '-' : '') + '€' + f(Math.abs(n)); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(t) { var h = $('toastHost'); h.innerHTML = ''; var d = el('div', 'toast', esc(t)); h.appendChild(d); setTimeout(function () { d.remove(); }, 2800); }

  /* CSV */
  function parseCsv(text) {
    var rows = [], row = [], cell = '', q = false, i, c;
    text = String(text).replace(/^﻿/, '');
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function importText(text, fname) {
    var rows = parseCsv(text); if (rows.length < 2) throw new Error('vuoto');
    var h = rows[0].map(function (x) { return x.trim().toLowerCase(); });
    ['utente', 'data', 'totale_usd'].forEach(function (c) { if (h.indexOf(c) < 0) throw new Error('colonna ' + c); });
    var ix = function (c) { return h.indexOf(c); };
    var byUser = {};
    rows.slice(1).forEach(function (r) {
      var u = (r[ix('utente')] || '').trim() || 'Senza nome';
      var o = { tipo: (ix('tipo') >= 0 ? r[ix('tipo')] : 'spesa') || 'spesa', data: r[ix('data')], ora: r[ix('ora')] || '', desc: r[ix('descrizione')] || '', cat: r[ix('categoria')] || 'Altro',
        usd: num(r[ix('totale_usd')]), eur: num(r[ix('totale_eur')]), sub: r[ix('subtotale_usd')], tax: r[ix('tasse_usd')], tip: r[ix('mancia_usd')], src: r[ix('origine')] || '' };
      if (ix('valuta') >= 0 && /^EUR/i.test((r[ix('valuta')] || '').trim())) { o.cur = 'EUR'; o.usd = 0; }      // spesa in Italia: in euro, fuori plafond
      if (!o.data || (!o.usd && !(o.cur === 'EUR' && o.eur))) return;
      (byUser[u] = byUser[u] || []).push(o);
    });
    var n = 0;
    Object.keys(byUser).forEach(function (u) {
      var p = st.people[u] || (st.people[u] = { expenses: [], topups: [] });
      p.expenses = byUser[u].filter(function (x) { return x.tipo !== 'ricarica' && x.cur !== 'EUR'; });      /* le spese sono quelle del telefono */
      p.italy = byUser[u].filter(function (x) { return x.tipo !== 'ricarica' && x.cur === 'EUR'; });
      var have = {}; p.topups.forEach(function (t) { have[tkey(u, t)] = 1; });
      byUser[u].filter(function (x) { return x.tipo === 'ricarica'; }).forEach(function (t) {
        var k = tkey(u, t); if (!have[k] && st.deleted.indexOf(k) < 0) { p.topups.push(t); have[k] = 1; }
      });
      n++;
    });
    return Object.keys(byUser);
  }
  function ekey(u, e) { return [u, e.data, e.ora, (e.cur === 'EUR' ? e.eur : e.usd).toFixed(2), e.desc].join('|'); }
  /* commento a una spesa: resta salvato anche se reimporti il file del telefono */
  function expItem(u, e) {
    var k = ekey(u, e), box = el('div', 'exp'), cm = el('div', 'cm');
    box.appendChild(el('div', 'erow', '<span>' + esc((e.ora ? e.ora + ' ' : '') + (e.store || e.desc || e.cat)) + (e.loc ? ' 📍' : '') + '</span><span class="num">' + (e.cur === 'EUR' ? eur(e.eur) : usd(e.usd)) + '</span>'));
    if (e.photo && e.id && window.fetchReceiptGlobal) {
      var rb = el('button', 'cbtn', 'Vedi scontrino'); rb.type = 'button';
      rb.onclick = function () { rb.textContent = 'Carico…'; window.fetchReceiptGlobal(e.id).then(function (url) { rb.textContent = 'Vedi scontrino'; if (url) window.lightboxGlobal([{ src: url, cap: u + ' · ' + dayLabel(e.data) + ' ' + e.ora + ' · ' + usd(e.usd), link: e.loc ? 'https://maps.apple.com/?ll=' + e.loc.la + ',' + e.loc.lo : '', name: 'scontrino.jpg' }], 0); else toast('Scontrino non disponibile'); }, function () { rb.textContent = 'Vedi scontrino'; toast('Scontrino non disponibile'); }); };
      box.appendChild(rb);
    }
    box.appendChild(cm);
    function view() {
      cm.innerHTML = ''; cm.className = 'cm';
      var t = st.comments[k], b = el('button', t ? 'cnote' : 'cbtn'); b.type = 'button';
      if (t) { b.textContent = t; b.title = 'Modifica il commento'; } else b.textContent = '+ Commento';
      b.onclick = edit; cm.appendChild(b);
    }
    function edit() {
      cm.innerHTML = ''; cm.className = 'cm cedit';
      var ta = document.createElement('textarea'); ta.rows = 2; ta.value = st.comments[k] || ''; ta.placeholder = 'Scrivi un commento…'; ta.setAttribute('aria-label', 'Commento alla spesa');
      var row = el('div', 'crow'), ok = el('button', 'btn small', 'Salva'), no = el('button', 'btn ghost small', 'Annulla');
      ok.type = no.type = 'button';
      ok.onclick = function () { var v = ta.value.trim(); if (v) st.comments[k] = v; else delete st.comments[k]; persist(); view(); };
      no.onclick = view;
      ta.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') view(); });
      row.appendChild(ok); row.appendChild(no);
      if (st.comments[k]) { var del = el('button', 'btn ghost small', 'Elimina'); del.type = 'button'; del.onclick = function () { delete st.comments[k]; persist(); view(); }; row.appendChild(del); }
      cm.appendChild(ta); cm.appendChild(row); ta.focus();
    }
    view(); return box;
  }
  function tkey(u, t) { return [u, t.data, t.ora, t.usd.toFixed(2), t.desc].join('|'); }

  /* calcoli */
  function sum(a, k) { return a.reduce(function (s, x) { return s + x[k]; }, 0); }
  function days(exps) {
    var m = {}; exps.forEach(function (e) { (m[e.data] = m[e.data] || []).push(e); });
    return m;
  }
  function dayLabel(d) { return new Date(d + 'T12:00:00').toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }); }
  var CAT_COLORS = { Cibo: '#ff9f0a', Vestiti: '#bf5af2', Regali: '#ff375f', Souvenir: '#ffd60a', Benzina: '#8e8e93', Hotel: '#0a84ff', Attrazioni: '#30d158', Altro: '#64d2ff' };
  function catColor(k) { return CAT_COLORS[k] || '#8e8e93'; }
  function catBlock(exps) {
    var by = {}; exps.forEach(function (e) { by[e.cat] = (by[e.cat] || 0) + e.usd; });
    var keys = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; }), tot = sum(exps, 'usd');
    var box = el('div', 'sect'); box.appendChild(el('div', 'label', 'Spese per tipologia'));
    if (!keys.length) { box.appendChild(el('div', 'sub2', 'Nessuna spesa')); return box; }
    var off = 0, svg = '<svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(120,130,150,.22)" stroke-width="6.5"></circle>';
    keys.forEach(function (k) {
      var p = by[k] / tot * 100, gap = keys.length > 1 ? Math.min(.6, p / 3) : 0;
      svg += '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' + catColor(k) + '" stroke-width="6.5" stroke-dasharray="' + (p - gap) + ' ' + (100 - p + gap) + '" stroke-dashoffset="' + (-off) + '"></circle>';
      off += p;
    });
    var donut = el('div', 'donut', svg + '</svg><div class="mid"><b class="num">' + usd(tot) + '</b><span>' + keys.length + (keys.length === 1 ? ' tipologia' : ' tipologie') + '</span></div>');
    donut.setAttribute('role', 'img'); donut.setAttribute('aria-label', 'Grafico delle spese per tipologia');
    box.appendChild(donut);
    var lg = el('div', 'legend');
    keys.forEach(function (k) { lg.appendChild(el('div', '', '<i style="background:' + catColor(k) + '"></i><span class="n">' + esc(k) + '</span><span class="v num">' + usd(by[k]) + ' <small>' + Math.round(by[k] / tot * 100) + '%</small></span>')); });
    box.appendChild(lg);
    return box;
  }
  function statBlock(name, topups, exps, isTotal) {
    var top = sum(topups, 'usd'), sp = sum(exps, 'usd'), left = top - sp, spE = sum(exps, 'eur'), topE = sum(topups, 'eur');
    var pct = top > 0 ? Math.min(100, sp / top * 100) : 0, cls = !top ? '' : pct >= 100 ? 'bad' : pct >= 80 ? 'warn' : 'good';
    var b = el('div', 'stat');
    b.appendChild(el('div', 'label', 'Plafond rimasto'));
    b.appendChild(el('div', 'left num ' + cls, top || sp ? usd(left) : '—'));
    b.appendChild(el('div', 'sub2 num', eur(topE - spE)));
    b.appendChild(el('div', 'bar', '<i class="' + cls + '" style="width:' + pct + '%"></i>'));
    b.appendChild(el('div', 'sub2 num', 'Ricaricato ' + usd(top) + ' · speso ' + usd(sp) + ' (' + eur(spE) + ')'));
    return b;
  }

  function personCol(name) {
    var p = st.people[name], col = el('section', 'col glass');
    var h = el('h2', '', '<span>' + esc(name) + '</span>');
    var rm = el('button', 'btn ghost small', 'Rimuovi'); var armed = false;
    rm.onclick = function () { if (!armed) { armed = true; rm.textContent = 'Conferma?'; setTimeout(function () { armed = false; rm.textContent = 'Rimuovi'; }, 3000); return; } delete st.people[name]; persist(); render(); };
    h.appendChild(rm); col.appendChild(h);
    col.appendChild(statBlock(name, p.topups, p.expenses));
    col.appendChild(catBlock(p.expenses));
    /* giorno per giorno */
    var d = days(p.expenses), keys = Object.keys(d).sort().reverse(), box = el('div', 'sect');
    box.appendChild(el('div', 'label', 'Giorno per giorno'));
    if (!keys.length) box.appendChild(el('div', 'sub2', 'Nessuna spesa'));
    keys.forEach(function (k) {
      var items = d[k], det = el('details'), tot = sum(items, 'usd');
      det.appendChild(el('summary', '', '<span class="d">' + esc(dayLabel(k)) + '</span><span class="num">' + usd(tot) + '</span>'));
      var it = el('div', 'items');
      items.sort(function (a, b) { return (a.ora || '').localeCompare(b.ora || ''); }).forEach(function (e) { it.appendChild(expItem(name, e)); });
      det.appendChild(it); box.appendChild(det);
    });
    col.appendChild(box);
    /* spese fatte in Italia prima della partenza: in euro, fuori dal plafond */
    var it = p.italy || [];
