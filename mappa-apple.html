<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Mappa</title>
<!-- Solo la mappa Apple (MapKit JS), vuota. La usa l'app iOS dentro un riquadro: i punti arrivano dall'app con postMessage e non passano da nessun server.
     Il token vale solo su questo sito (tarragona2026.github.io): non e' un segreto. -->
<style>
html, body, #m { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e9eef2; }
.dot.shake { animation: tremble .5s infinite; box-shadow: 0 0 0 5px rgba(255,255,255,.55), 0 2px 8px rgba(0,0,0,.35); }
@keyframes tremble { 0%, 100% { transform: translate(0, 0) rotate(0); } 15% { transform: translate(-3px, 1px) rotate(-10deg); } 30% { transform: translate(3px, -1px) rotate(9deg); } 45% { transform: translate(-3px, -1px) rotate(-8deg); } 60% { transform: translate(3px, 1px) rotate(8deg); } 80% { transform: translate(-2px, 0) rotate(-4deg); } }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #fff; color: #fff; font: 700 13px/24px -apple-system, system-ui, sans-serif; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: pointer; }
</style>
</head>
<body>
<div id="m"></div>
<script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js" crossorigin></script>
<script>
(function () {
  var TOKEN = 'eyJraWQiOiI5WlFRRDVONEEzIiwidHlwIjoiSldUIiwiYWxnIjoiRVMyNTYifQ.eyJpc3MiOiIzOVhCVTUzMkNUIiwiaWF0IjoxNzk0NDAwODQ1LCJvcmlnaW4iOiJ0YXJyYWdvbmEyMDI2LmdpdGh1Yi5pbyIsInNjb3BlIjoibWFwa2l0X2pzIn0.oBuD-qWNoRADx34HWO2xn6dwUwV7jlENOb_houcD4RSbcmuXs9L_BcRcDdoT-zHo3mCfu5ewScHcV0PfMh3-Fg';
  var map = null, anns = [], ready = false, queued = null;
  function send(o) { try { parent.postMessage(o, '*'); } catch (e) {} }   // verso l'app vanno solo "pronta", "errore" e l'id del punto toccato
  if (!window.mapkit) { send({ src: 'amap', t: 'err', why: 'script' }); return; }
  var lastTap = 0;
  function tap(id) { var n = Date.now(); if (n - lastTap < 400) return; lastTap = n; send({ src: 'amap', t: 'tap', id: id }); }   // un solo avviso anche se arrivano piu' eventi per lo stesso tocco
  function dot(color, text, id, shake) { return function () {
    var d = document.createElement('div'); d.className = 'dot' + (shake ? ' shake' : ''); d.style.background = color; d.textContent = text || '';
    d.addEventListener('click', function () { tap(id); }); d.addEventListener('touchend', function () { tap(id); });
    return d;
  }; }
  function draw(msg) {
    if (!ready) { queued = msg; return; }
    if (anns.length) map.removeAnnotations(anns);
    anns = (msg.pts || []).map(function (p) {
      var a = new mapkit.Annotation(new mapkit.Coordinate(p.la, p.lo), dot(p.color || '#d70015', p.text, p.id, p.shake), { calloutEnabled: false, size: { width: 30, height: 30 }, data: { id: p.id } });
      a.addEventListener('select', function () { tap(p.id); setTimeout(function () { map.selectedAnnotation = null; }, 0); });
      return a;
    });
    if (anns.length) map.addAnnotations(anns);
    var fx = !!msg.fixed, sp = msg.span > 0 ? msg.span : 0.02;      // fixed: mappa ferma (anteprima di una foto), senza tasti
    map.isScrollEnabled = !fx; map.isZoomEnabled = !fx; map.isRotationEnabled = false; map.showsZoomControl = !fx;
    if (msg.fit === false) return;
    if (msg.center) { map.setRegionAnimated(new mapkit.CoordinateRegion(new mapkit.Coordinate(msg.center.la, msg.center.lo), new mapkit.CoordinateSpan(sp, sp)), false); return; }      // centra su un punto (spesa scelta dal Registro)
    if (anns.length === 1) map.setRegionAnimated(new mapkit.CoordinateRegion(anns[0].coordinate, new mapkit.CoordinateSpan(sp, sp)), false);
    else if (anns.length) map.showItems(anns, { animate: false, padding: new mapkit.Padding(50, 40, 50, 40), minimumSpan: new mapkit.CoordinateSpan(0.01, 0.01) });
  }
  mapkit.addEventListener('error', function (e) { send({ src: 'amap', t: 'err', why: (e && e.status) || 'mapkit' }); });
  mapkit.addEventListener('configuration-change', function (e) {
    if (e.status !== 'Initialized' || ready) return;
    ready = true; send({ src: 'amap', t: 'ready' });
    if (queued) { var q = queued; queued = null; draw(q); }
  });
  try {
    mapkit.init({ authorizationCallback: function (done) { done(TOKEN); }, language: 'it' });
    map = new mapkit.Map('m', { showsMapTypeControl: false, showsZoomControl: true, showsCompass: mapkit.FeatureVisibility.Hidden, showsPointsOfInterest: true,
      region: new mapkit.CoordinateRegion(new mapkit.Coordinate(29.76, -95.37), new mapkit.CoordinateSpan(1.2, 1.2)) });
  } catch (e) { send({ src: 'amap', t: 'err', why: 'init' }); return; }
  window.addEventListener('message', function (ev) { var d = ev.data; if (d && d.src === 'app' && d.t === 'set') draw(d); });
  send({ src: 'amap', t: 'loaded' });
})();
</script>
</body>
</html>
