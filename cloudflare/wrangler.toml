# Xmas in Texa$ — servizio che spedisce le notifiche (Cloudflare Worker, piano gratuito).
# La chiave privata NON sta qui: va messa come segreto con `wrangler secret put VAPID_JWK`.
name = "texas-push"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# App iOS (APNs). La chiave .p8 e il suo ID NON stanno qui: `wrangler secret put APNS_KEY` e `wrangler secret put APNS_KEY_ID`.
[vars]
APNS_TEAM_ID = "39XBU532CT"
APNS_TOPIC = "com.tarragona2026.xmastexas.prova"
